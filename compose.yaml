name: sobe-desce
services:
  server:
    image: sobe-desce/server:${APP_VERSION:-local}
    build:
      context: .
      target: server
      args: { APP_VERSION: "${APP_VERSION:-local}" }
    environment:
      NODE_ENV: production
      AUTH_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CLIENT_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run node deploy/init-env.mjs}
      METRICS_TOKEN: ${METRICS_TOKEN:?Run node deploy/init-env.mjs}
      ACCOUNT_DATABASE: /data/accounts.sqlite
      TRUST_PROXY: "true"
    volumes: [accounts-data:/data]
    read_only: true
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    image: sobe-desce/web:${APP_VERSION:-local}
    build:
      context: .
      target: web
      args: { APP_VERSION: "${APP_VERSION:-local}" }
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"]
    depends_on:
      server: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  alloy:
    extends: { file: observability/compose.yaml, service: alloy }
    environment:
      GAME_TARGET: server:3001
    depends_on:
      server: { condition: service_healthy }
      prometheus: { condition: service_started }
    restart: unless-stopped
  prometheus:
    extends: { file: observability/compose.yaml, service: prometheus }
    restart: unless-stopped
  grafana:
    extends: { file: observability/compose.yaml, service: grafana }
    restart: unless-stopped
volumes:
  accounts-data:
  alloy-data:
  prometheus-data:
  grafana-data:
